<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQRS Practice - English Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="icon-btn"><i class='bx bx-arrow-back'></i></a>
        <div class="logo">
            <i class='bx bx-shuffle'></i>
            <span>PQRS Practice</span>
        </div>
        <div style="width: 24px;"></div>
    </header>

    <main class="container">
        <div class="stats-card" style="margin-bottom: 20px; text-align: center; display: block;">
            <h3 style="color: var(--primary-color);">Sentence Rearrangement</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">SSC CGL Tier-I Authentic Questions</p>
        </div>

        <div id="quiz-container">
            <!-- Questions will be injected here by pqrs.js -->
        </div>
    </main>

    <!-- Floating AI Button for doubts -->
    <button class="floating-ai-btn" onclick="openAI()" style="bottom: 20px; right: 20px; padding: 12px 20px; font-size: 1rem;">
        <i class='bx bx-bot'></i> Doubt?
    </button>

    <!-- AI Chat Modal -->
    <div id="ai-modal" class="modal-overlay" style="display: none;">
        <div class="chat-container">
            <div class="chat-header">
                <h3><i class='bx bx-bot'></i> AI Teacher</h3>
                <button class="icon-btn" onclick="closeAI()"><i class='bx bx-x'></i></button>
            </div>
            <div id="chat-box" class="chat-box">
                <div class="ai-msg">Need help with PQRS tricks? Paste the sentence here or ask for Rani Ma'am's trick video!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="ai-input" placeholder="Type your doubt..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="askAI()"><i class='bx bx-send'></i></button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="pqrs.js"></script>
</body>
</html>
